name: Build Redmi MT6768 Kernel (Clang r399163b)

on:
  push:
    branches:
      - lancelot-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout kernel source
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      # Step 2: Checkout Clang toolchain from Nicklas373 repo
      - name: Checkout Clang Toolchain (r399163b)
        uses: actions/checkout@v4
        with:
          repository: Nicklas373/aosp-clang
          ref: r399163b
          path: clang

      # Step 3: Add Clang to PATH
      - name: Add Clang to PATH
        run: echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      # Step 4: Install dependencies (wajib untuk compile)
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev make gcc build-essential \
            libncurses-dev curl cpio python3 \
            gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      # Step 5: Create output directory
      - name: Create Output Directory
        run: mkdir -p out

      # Step 6: Compile Kernel
      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out ARCH=arm64 lancelot_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32}

      # Step 7: Upload the kernel image as artifact
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/arch/arm64/boot/Image*
