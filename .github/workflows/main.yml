name: Kernel Build with aosp-clang r399163b

on:
  push:
    branches:
      - lancelot-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Checkout Clang Toolchain (r399163b)
        uses: actions/checkout@v4
        with:
          repository: Nicklas373/aosp-clang
          ref: r399163b
          path: clang

      - name: Add Clang to PATH
        run: echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make gcc \
            build-essential libncurses-dev curl cpio python3

      - name: Create Output Directory
        run: mkdir -p out

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 lancelot_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu-
