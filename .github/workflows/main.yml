name: Build Kernel (EvaGCC - Lancelot)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 6" # build otomatis tiap Sabtu

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: lancelot_defconfig
      TOOLCHAIN: EvaGCC-arm64
      KERNEL_DIR: ${{ github.workspace }}/kernel
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git \
              libssl-dev make python3 python3-pip zip unzip curl

      - name: Clone EvaGCC toolchain
        run: |
          git clone --depth=1 https://github.com/Dhruvgera/EvaGCC-arm64.git ${{ github.workspace }}/toolchain
          echo "PATH=${{ github.workspace }}/toolchain/bin:$PATH" >> $GITHUB_ENV

      - name: Prepare output folder
        run: mkdir -p ${{ github.workspace }}/out

      - name: Configure kernel
        run: |
          cd $KERNEL_DIR
          make O=${{ github.workspace }}/out ARCH=$ARCH $DEFCONFIG CROSS_COMPILE=aarch64-elf-

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          make -j$(nproc) O=${{ github.workspace }}/out ARCH=$ARCH CROSS_COMPILE=aarch64-elf-
          ls -lh ${{ github.workspace }}/out/arch/arm64/boot/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/
            out/.config
